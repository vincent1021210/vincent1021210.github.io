<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PATS 鬧鐘 · 手錶</title>
  <meta http-equiv="refresh" content="0; url=alarm.html">
  <script>location.replace("alarm.html");</script>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="watch">
  <div id="map" hidden></div>
  <div class="watch-face">
    <nav class="watch-rail">
      <a class="on" href="watch.html">導航</a>
      <a href="alarm.html">鬧鐘</a>
    </nav>
    <input id="search" type="text" placeholder="終點" autocomplete="off">
    <ul id="suggest" hidden></ul>
    <div class="modes">
      <button type="button" id="mode-drive" class="mode on">開車</button>
      <button type="button" id="mode-walk" class="mode">走路</button>
    </div>
    <p id="instruction">說出或輸入終點</p>
    <p id="eta"></p>
    <button type="button" id="nav-btn">開始</button>
  </div>
  <p id="toast" hidden></p>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
