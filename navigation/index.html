<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PATS 導航</title>
  <meta name="theme-color" content="#1A73E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231A73E8'/><path d='M16 6c4 0 8 3.2 8 8 0 6-8 12-8 12S8 20 8 14c0-4.8 4-8 8-8zm0 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z' fill='white'/></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var watch = /Watch|Wear|SM-R|TicWatch|Pixel Watch/i.test(ua) ||
        (Math.min(window.innerWidth, window.innerHeight) <= 320 && window.innerHeight <= 400);
      if (watch && !/[\?&]phone=1/.test(location.search)) {
        location.replace("watch.html");
      }
    })();
  </script>
</head>
<body class="explore">
  <div id="map" aria-label="地圖"></div>

  <header id="explore-header" class="explore-header">
    <nav class="app-rail">
      <a class="on" href="index.html">導航</a>
      <a href="alarm.html">鬧鐘</a>
    </nav>
    <div class="search-pill">
      <input id="search" type="text" placeholder="搜尋終點" autocomplete="off" inputmode="search">
      <button type="button" id="voice" class="mic" aria-label="語音">🎤</button>
    </div>
    <ul id="suggest" hidden></ul>
    <div class="chips" role="group" aria-label="交通方式">
      <button type="button" id="mode-drive" class="chip on">開車</button>
      <button type="button" id="mode-walk" class="chip">走路</button>
    </div>
  </header>

  <section id="turn-card" class="turn-card" hidden>
    <span class="turn-arrow" aria-hidden="true">➔</span>
    <div>
      <p id="turn-distance"></p>
      <p id="turn-instruction"></p>
    </div>
  </section>

  <button type="button" id="locate" class="locate-fab" aria-label="目前位置"></button>

  <section class="sheet">
    <div class="grabber"></div>
    <p id="dest-title">搜尋終點後即可規劃路線</p>
    <p id="eta-clock" hidden></p>
    <p id="eta"></p>
    <p id="instruction" hidden></p>
    <button type="button" id="nav-btn">開始</button>
    <div class="links">
      <a href="PATS-導航-debug.apk" download>手機 APK</a>
      <a href="PATS-導航-手錶.apk" download>手錶 APK</a>
      <a href="watch.html">手錶畫面</a>
    </div>
  </section>

  <p id="toast" hidden></p>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
