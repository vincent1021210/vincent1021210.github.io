<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PATS 鬧鐘 · 手錶</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body class="watch alarm-page">
  <nav class="watch-rail">
    <a href="watch.html">導航</a>
    <a class="on" href="alarm.html">鬧鐘</a>
  </nav>
  <div class="watch-face">
    <section id="panel-list">
      <div id="cards"></div>
      <button type="button" id="add">新增鬧鐘</button>
    </section>
    <section id="panel-edit" hidden>
      <div class="card edit-card">
        <div>
          <p id="edit-label">今天</p>
          <p id="edit-time">上午 7:00</p>
        </div>
        <label class="switch"><input type="checkbox" id="edit-on"><span></span></label>
      </div>
      <button type="button" id="edit-time-btn">編輯時間</button>
      <div id="days" class="days"></div>
      <p id="edit-status">鬧鐘已關閉</p>
      <button type="button" id="edit-delete" class="danger">刪除鬧鐘</button>
      <button type="button" id="edit-back" class="ghost">返回列表</button>
    </section>
    <section id="panel-pick" hidden>
      <p class="pick-title">選取時間</p>
      <div class="pick-row">
        <button type="button" id="pick-hour" class="digit on">07</button>
        <span>:</span>
        <button type="button" id="pick-min" class="digit">00</button>
        <div class="ampm">
          <button type="button" id="pick-am">AM</button>
          <button type="button" id="pick-pm" class="on">PM</button>
        </div>
      </div>
      <div id="dial" class="dial"></div>
      <button type="button" id="pick-done">完成</button>
    </section>
  </div>
  <div id="ring" class="ring" hidden>
    <p>鬧鐘時間到</p>
    <div class="ring-actions">
      <button type="button" id="snooze">貪睡 5 分</button>
      <button type="button" id="dismiss">關閉</button>
    </div>
  </div>
  <p id="toast" hidden></p>
  <script src="alarm.js?v=8"></script>
</body>
</html>
