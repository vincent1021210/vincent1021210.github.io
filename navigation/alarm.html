<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PATS 鬧鐘 · 手錶</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="watch alarm-page">
  <div class="watch-face">
    <p id="now">現在 --:--:--</p>
    <p class="alarm-title">鬧鐘</p>
    <p id="set">07:00</p>
    <div class="alarm-wheels">
      <div class="wheel">
        <button type="button" id="h-plus">＋</button>
        <p id="hour">07</p>
        <p class="wheel-label">時</p>
        <button type="button" id="h-minus">−</button>
      </div>
      <div class="wheel">
        <button type="button" id="m-plus">＋</button>
        <p id="minute">00</p>
        <p class="wheel-label">分</p>
        <button type="button" id="m-minus">−</button>
      </div>
    </div>
    <p id="remain">未設定</p>
    <button type="button" id="toggle">啟用</button>
    <p class="alarm-note">離開此頁後網頁鬧鐘可能不響</p>
  </div>
  <div id="ring" class="ring" hidden>
    <p>鬧鐘時間到</p>
    <div class="ring-actions">
      <button type="button" id="snooze">貪睡 5 分</button>
      <button type="button" id="dismiss">關閉</button>
    </div>
  </div>
  <p id="toast" hidden></p>
  <script src="alarm.js"></script>
</body>
</html>
